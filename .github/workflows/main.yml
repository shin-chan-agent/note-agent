name: Note AI Agent

concurrency:
  group: note-agent
  cancel-in-progress: false

on:
  workflow_dispatch: # 手動実行用
  schedule:
    - cron: '21 16 * * *'  # 日本時間 朝1:21

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug files
        run: |
          find . -maxdepth 3 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai Pillow

      - name: Run Python script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      - name: Upload Gemini response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-response
          path: gemini_response.txt

      - name: Check knowledge file
        run: |
          ls -l utils/
          cat utils/ai_knowledge.json

      - name: Commit history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            combination_history.json \
            article_history.json \
            utils/ai_knowledge.json

          git diff --cached --quiet || git commit -m "Update history"

          git pull --rebase origin main

          git push