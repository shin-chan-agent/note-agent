name: test-eyecatch

on:
  workflow_dispatch: # 手動実行用

permissions:
  contents: write

# 💡 「警告を消す魔法の呪文」！
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate test eyecatch
        run: |
          python -c "from utils.eyecatch_generator import create_eyecatch_background; create_eyecatch_background('test_eyecatch.png', 'AI画像・デザイン')"

      - name: Upload test eyecatch
        uses: actions/upload-artifact@v4
        with:
          name: test-eyecatch
          path: test_eyecatch.png