name: test-eyecatch

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Japanese font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate test eyecatch
        run: |
          python content/image/eyecatch.py

      - name: Copy eyecatch to docs
        run: |
          mkdir -p docs
          cp test_eyecatch.png docs/eyecatch.png

      - name: Save test eyecatch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test_eyecatch.png docs/eyecatch.png
          git commit -m "Add test eyecatch" || echo "No changes to commit"
          git push

      - name: Upload test eyecatch
        uses: actions/upload-artifact@v4
        with:
          name: test-eyecatch
          path: test_eyecatch.png